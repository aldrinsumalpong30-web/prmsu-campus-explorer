<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Map | PRMSU Campus Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container" id="map-section">
    <header class="page-header">
      <h1 class="h2">Interactive Campus Map</h1>
      <p>Tap a marker or pick a department to see details and directions.</p>
    </header>

    <div class="search-field mb-3">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="search" class="form-control" placeholder="Search departments or buildings..."
             aria-label="Search the map">
    </div>

    <div class="map-card"><div id="map"></div></div>
    <div id="legend" class="legend"></div>
    <div id="list" class="row g-2 mt-3"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/pages/map.js"></script>
</body>
</html>
