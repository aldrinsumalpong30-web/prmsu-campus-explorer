<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directory | PRMSU Campus Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container mt-4">
    <h2>Department Directory</h2>

    <div class="row g-2 my-3">
      <div class="col-md-8">
        <input id="search" class="form-control" placeholder="Search by department or building..."
               aria-label="Search departments">
      </div>
      <div class="col-md-4">
        <select id="category" class="form-select" aria-label="Filter by category">
          <option value="0">All categories</option>
        </select>
      </div>
    </div>

    <p id="count" class="small text-muted"></p>
    <div class="row g-4" id="results"><p>Loading...</p></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/directory.js"></script>
</body>
</html>
