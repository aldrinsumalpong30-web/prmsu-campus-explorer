<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRMSU Campus Explorer</title>
  <meta name="description" content="Find colleges, offices and facilities at PRMSU and get directions across campus.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main>
    <section class="hero text-center">
      <div class="container">
        <h1 class="display-4 fw-bold">Explore PRMSU</h1>
        <p class="lead">Find colleges, offices and facilities, and get directions across campus.</p>
        <form action="departments.html" class="row justify-content-center g-2 mb-3" role="search">
          <div class="col-md-5">
            <input name="q" class="form-control form-control-lg"
                   placeholder="Search department or building" aria-label="Search departments">
          </div>
        </form>
        <a href="map.html" class="btn btn-gold btn-lg">
          <i class="fa-solid fa-map-location-dot"></i> Explore Campus
        </a>
      </div>
    </section>

    <section class="container mt-5">
      <h2 class="mb-4">Featured Departments</h2>
      <div class="row g-4" id="featured"><p>Loading...</p></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
